<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EBEF">
<title>Mi cartera</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi cartera">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EBEF;--ink:#111318;--muted:#5A5F6B;--line:#EEF0F3;--green:#137A43;--greenbg:#D9F2E3;--red:#C62828;--redbg:#FCE4E4;--blue:#1F3FD1;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:48px;min-height:100vh}
.conf{padding:48px 24px}.conf h1{font-size:26px;margin:0 0 6px}.conf p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 6px}
.pie{text-align:center;padding:24px 20px 0}.pie button{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;min-height:44px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0;gap:8px}
.titulo{font-size:22px;font-weight:700}
.acc{display:flex;gap:8px;align-items:center}
.btn{height:44px;padding:0 16px;border-radius:22px;border:none;background:var(--ink);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.claro{background:#fff;color:var(--ink)}
.btn.ico{width:44px;padding:0}
.btn.peligro{background:var(--redbg);color:var(--red)}
.btn:disabled{opacity:.5}
.gira svg{animation:g 0.9s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
.panel{background:#fff;border-radius:22px;margin:16px 20px 0;padding:18px 20px}
.total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.total .lbl{font-size:13px;color:var(--muted)}
.total .num{font-family:var(--mono);font-size:42px;font-weight:700;letter-spacing:-2px;line-height:1;margin-top:6px}
.total.neg .num,.total.neg .lbl{color:var(--red)}
.badge{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sub{font-size:12px;color:var(--muted);margin-top:10px}
.aviso{margin:12px 20px 0;padding:12px 14px;border-radius:14px;background:#FFF4D6;color:#5C4300;font-size:13px;display:flex;gap:10px;align-items:center}
.pila{position:relative;margin:18px 20px 0}
.tj{position:absolute;left:0;width:100%;height:200px;border-radius:20px;color:#fff;padding:16px 18px;border:none;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 -4px 14px rgba(0,0,0,.18);overflow:hidden}
.tj:active{transform:translateY(-2px)}
.fila{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.col{display:flex;flex-direction:column}
.nom{font-size:15px;font-weight:700}
.det{font-size:12px;opacity:.85}
.amt{font-family:var(--mono);font-size:24px;font-weight:700;white-space:nowrap}
.deco{position:absolute;right:-40px;bottom:-70px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.barra{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.barra i{display:block;height:6px;border-radius:3px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.c-amarillo{background:#FFD24A;color:#111318}.c-naranja{background:#FF9F6B;color:#111318}.c-rojo{background:#FFFFFF;color:#B3141B}.c-verde{background:#7CF0B0;color:#0C3B22}.c-blanco{background:rgba(255,255,255,.18);color:#fff}
.h3{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);padding:22px 24px 0;text-transform:uppercase}
.lista{background:#fff;border-radius:18px;margin:10px 20px 0;padding:4px 16px}
.sec{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);padding-top:12px;text-transform:uppercase}
.mov{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.mov:last-child{border-bottom:none}
.ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mov .t{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.mov .t b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .t span{font-size:12px;color:var(--muted)}
.mov .m{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}
.vacio{padding:20px 0;text-align:center;color:var(--muted);font-size:14px}
.volver{display:flex;align-items:center;gap:4px;padding:14px 16px 0}
.volver a,.volver button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:22px}
.grande{margin:8px 20px 0;min-height:200px;border-radius:20px;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;position:relative;overflow:hidden}
.grande .num{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 20px 0}
.stat{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dos{display:flex;gap:10px;padding:14px 20px 0}
.dos .btn{flex:1;height:48px;border-radius:14px}
.filtros{display:flex;gap:8px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none}
.filtros button{height:40px;padding:0 16px;border-radius:20px;border:none;background:#fff;font-size:13px;font-weight:600;flex-shrink:0}
.filtros button.on{background:var(--ink);color:#fff}
.velo{position:fixed;inset:0;background:rgba(17,19,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.velo.on{display:flex}
.hoja{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.hoja .cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hoja h2{margin:0;font-size:18px}
.x{width:44px;height:44px;border:none;background:var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border:none;border-radius:10px;background:none;font-weight:600;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.45}
.campo{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px;color:var(--muted);font-weight:500}
.campo input,.campo select{height:48px;border-radius:12px;border:1.5px solid #D5D8DE;padding:0 14px;background:#fff;color:var(--ink);width:100%}
.campo input:focus,.campo select:focus{outline:2px solid var(--ink);outline-offset:1px}
.campo .montoIn{font-family:var(--mono);font-size:30px;font-weight:700;height:64px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;min-height:44px}
.check input{width:22px;height:22px}
.botones{display:flex;gap:10px;margin-top:22px}
.botones .btn{flex:1;height:52px;font-size:15px;border-radius:14px}
.iconos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.iconos label{position:relative}
.iconos input{position:absolute;opacity:0}
.iconos span{height:48px;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;border:2px solid transparent}
.iconos input:checked+span{border-color:var(--ink);background:#fff}
.iconos input:focus-visible+span{outline:2px solid var(--blue)}
.nota{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.4}
.ajrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--line);font-size:14px}
.fila-btn{display:flex;align-items:center;gap:12px;width:calc(100% - 40px);margin:12px 20px 0;padding:14px 16px;border:none;border-radius:18px;background:#fff;text-align:left}
.fila-btn .t{flex-grow:1;display:flex;flex-direction:column;gap:2px}.fila-btn .t b{font-size:15px}.fila-btn .t span{font-size:12px;color:var(--muted)}
.punto{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FFD24A;color:#111318;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.barra.gris{background:var(--line)}.barra.gris i{background:var(--green)}
.est{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.est.pagado{background:var(--greenbg);color:var(--green)}.est.pendiente{background:var(--line);color:var(--ink)}.est.atrasado{background:var(--redbg);color:var(--red)}.est.pronto{background:#FFF1C7;color:#6B4E00}
.sug{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.sug:last-child{border-bottom:none}
.sug .acc2{display:flex;gap:6px}.sug .btn{height:40px;padding:0 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.cargando{padding:120px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main class="app" id="app"><div class="cargando">Cargando tu cartera…</div></main>

<div class="velo" id="velo" onclick="if(event.target===this)cerrar()">
  <div class="hoja" id="hoja" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const IC={
 super:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
 comida:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
 gasolina:'<line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/>',
 farmacia:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
 tiendas:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
 suscripciones:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
 transferencias:'<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
 pagos:'<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',
 sueldo:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
 otros:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
 etiqueta:'<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1"/>',
 casa:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 carro:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
 regalo:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
 salud:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
 educacion:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
 deporte:'<path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M3 9v6"/><path d="M21 9v6"/><rect x="5" y="5" width="3" height="14" rx="1"/><rect x="16" y="5" width="3" height="14" rx="1"/><path d="M8 12h8"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M20 6 9 17l-5-5"/>', alerta:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>',
 recarga:'<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>', atras:'<path d="m15 18-6-6 6-6"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
 calendario:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 chevron:'<path d="m9 18 6-6-6-6"/>',
 ajustes:'<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>'
};
const COL={super:['#E3F1E4','#1E6B34'],comida:['#FDEBDD','#A4470F'],gasolina:['#FFF2CC','#7A5A00'],farmacia:['#E4F0FB','#1B5E9E'],tiendas:['#F3E5F5','#6A1B9A'],suscripciones:['#E8E6FB','#4232B8'],transferencias:['#E2E6FA','#1F3FD1'],pagos:['#E2E6FA','#1F3FD1'],sueldo:['#D9F2E3','#137A43'],otros:['#EEF0F3','#3B404B'],etiqueta:['#EEF0F3','#3B404B'],casa:['#FBE9E7','#9C3B1E'],carro:['#E0F2F1','#00695C'],regalo:['#FCE4EC','#AD1457'],salud:['#FFEBEE','#B71C1C'],educacion:['#E8EAF6','#283593'],deporte:['#F1F8E9','#33691E']};
const ICONOS_NUEVOS=['etiqueta','casa','carro','regalo','salud','educacion','deporte','comida','tiendas','super','suscripciones','otros'];

let D=null, vista='inicio', sel=null, filtro='todos', edit=null, tipoMov='GASTO', quitarAj=false, confirmaBorrar=false, volverAMov=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sv=(k,s,w)=>'<svg width="'+(s||18)+'" height="'+(s||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[k]||IC.etiqueta)+'</svg>';
const d0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
function fdia(iso){const dif=Math.round((d0(new Date())-d0(iso))/864e5);if(dif===0)return'Hoy';if(dif===1)return'Ayer';const d=new Date(iso);return d.getDate()+' '+MES[d.getMonth()];}
const fcorta=iso=>{const d=new Date(iso);return d.getDate()+' '+MES[d.getMonth()];};
const hora=iso=>new Date(iso).toLocaleTimeString('es-SV',{hour:'numeric',minute:'2-digit'});
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const diasTxt=n=>n===0?'hoy':n===1?'1 día':n+' días';
const cat=n=>D.cats.find(c=>c.nombre===n)||{nombre:n||'Otros',icono:'otros'};
const cta=id=>D.cuentas.find(c=>c.id===id)||{nombre:id,tipo:'debito'};

/* ---------- Conexión con Apps Script ---------- */
const LS={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
let CFG=null; try{CFG=JSON.parse(LS.get('cartera_cfg')||'null');}catch(e){CFG=null;}
async function llamar(fn,...args){
  if(!CFG) throw new Error('Falta conectar la app');
  const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:CFG.clave,accion:fn,args:args})});
  let j; try{j=await r.json();}catch(e){throw new Error('El script no respondió bien. Revisá que la implementación tenga acceso "Cualquier persona".');}
  if(!j.ok) throw new Error(j.error||'Error');
  if(fn!=='borrarMovimiento'||j.datos) LS.set('cartera_datos',JSON.stringify(j.datos));
  return j.datos;
}
function pantallaConectar(msg){
  $('app').innerHTML='<section class="conf"><h1>Mi cartera</h1><p>Conectá la app con tu Apps Script. Esto se hace una sola vez en este celular.</p>'+
   (msg?'<div class="aviso">'+sv('alerta',18)+'<span>'+esc(msg)+'</span></div>':'')+
   '<label class="campo">Link de la implementación (termina en /exec)<input id="cUrl" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(CFG?CFG.url:'')+'"></label>'+
   '<label class="campo">Clave secreta<input id="cClave" autocomplete="off" placeholder="La que te dio generarClave()"></label>'+
   '<div class="botones"><button class="btn" id="bCon" onclick="conectar()">Conectar</button></div></section>';
}
function conectar(){
  const url=$('cUrl').value.trim(), clave=$('cClave').value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){toast('El link debe terminar en /exec');return;}
  if(!clave){toast('Escribí la clave');return;}
  $('bCon').disabled=true; $('bCon').textContent='Conectando…';
  CFG={url:url,clave:clave};
  llamar('getDatos').then(d=>{LS.set('cartera_cfg',JSON.stringify(CFG));D=d;vista='inicio';render();toast('¡Conectada!');})
    .catch(e=>{CFG=null;pantallaConectar(e.message);});
}
function desconectar(){ if(!confirmaBorrar){confirmaBorrar=true;toast('Tocá otra vez para desconectar');setTimeout(()=>confirmaBorrar=false,3000);return;} LS.del('cartera_cfg');LS.del('cartera_datos');CFG=null;D=null;confirmaBorrar=false;pantallaConectar(); }
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2600);}
function fallo(e){toast((e&&e.message)||'Algo falló');document.querySelectorAll('button[disabled]').forEach(b=>b.disabled=false);}

function cargar(){
  if(!CFG){pantallaConectar();return;}
  try{const c=JSON.parse(LS.get('cartera_datos')||'null'); if(c&&c.cuentas){D=c;render();}}catch(e){}
  llamar('getDatos').then(d=>{D=d;render();}).catch(e=>{
    if(/Clave/.test(e.message)) pantallaConectar(e.message);
    else if(D) toast('Sin conexión: mostrando lo último guardado');
    else $('app').innerHTML='<div class="cargando">No pude cargar: '+esc(e.message)+'</div>';
  });

function render(){ if(!D.cuentas.length){$('app').innerHTML='<div class="cargando">Falta instalar: corré <b>instalar()</b> desde el editor de Apps Script.</div>';return;} vista==='inicio'?renderInicio():vista==='fijos'?renderFijos():renderDetalle(); }

function sigPago(c){return (c.proximos||[]).find(p=>p.enCurso);}
function chipPago(c){
  if(c.pagada){const n=sigPago(c);return '<span class="chip c-verde">'+sv('check',14,2.4)+'Corte pagado'+(n?' · siguiente '+fmt(n.monto)+' el '+fcorta(n.vence):'')+'</span>';}
  const d=c.diasPago, k=d<=3?'c-rojo':d<=5?'c-naranja':d<=10?'c-amarillo':'c-blanco';
  const cuanto=c.corteEmitido?'Pagar '+fmt(c.porPagar)+' ':'Pagar ';
  return '<span class="chip '+k+'">'+cuanto+(d===0?'hoy':'en '+diasTxt(d))+' · '+fcorta(c.proximoPago)+'</span>';
}
function montoCta(c){ if(c.tipo==='credito') return (c.deuda>0?'−':'')+fmt(c.deuda); return (c.saldo<0?'−':'')+fmt(c.saldo); }

function tarjeta(c,top,frente,z){
  const cred=c.tipo==='credito';
  const det=cred?(c.pagada?(sigPago(c)?'Próximo: '+fmt(sigPago(c).monto)+' · '+fcorta(sigPago(c).vence):'Corte pagado ✓'):(c.corteEmitido?'Pagar '+fmt(c.porPagar)+' · ':'Paga ')+fcorta(c.proximoPago)+' · '+diasTxt(c.diasPago)):'Débito •••• '+c.ultimos4;
  let extra='';
  if(frente&&cred){
    const pct=Math.min(100,Math.max(0,c.deuda/c.limite*100));
    extra='<span class="col" style="gap:10px;position:relative"><span class="fila det"><span>Disponible '+fmt(c.disponible)+'</span><span>Límite '+fmt(c.limite)+'</span></span><span class="barra"><i style="width:'+pct+'%"></i></span>'+chipPago(c)+'</span>';
  } else if(frente){
    extra='<span class="det" style="position:relative;letter-spacing:1px">•••• '+esc(c.ultimos4)+'</span>';
  }
  return '<button class="tj" style="top:'+top+'px;background:'+c.color+';z-index:'+z+'" onclick="verCuenta(\''+c.id+'\')" aria-label="Ver '+esc(c.nombre)+'"><span class="deco"></span><span class="fila"><span class="col"><span class="nom">'+esc(c.nombre)+'</span><span class="det">'+det+'</span></span><span class="amt">'+montoCta(c)+'</span></span>'+extra+'</button>';
}

function movHtml(m,conCuenta){
  const c=cat(m.categoria), col=COL[c.icono]||COL.otros;
  const ent=m.tipo==='ENTRADA', pago=m.categoria==='Pagos';
  const color=pago?'var(--blue)':ent?'var(--green)':'var(--ink)';
  const sub=(conCuenta?cta(m.cuentaId).nombre+' · ':'')+(conCuenta?fdia(m.fecha)+' ':'')+hora(m.fecha);
  return '<button class="mov" onclick="abrirMov(\''+m.id+'\')"><span class="ic" style="background:'+col[0]+';color:'+col[1]+'">'+sv(c.icono)+'</span><span class="t"><b>'+esc(m.comercio)+'</b><span>'+esc(sub)+'</span></span><span class="m" style="color:'+color+'">'+(ent?'+':'−')+fmt(m.monto).slice(1)+'</span></button>';
}

function hace(iso){ if(!iso) return 'Aún sin revisar correos'; const min=Math.round((Date.now()-new Date(iso))/60000); return 'Correos revisados '+(min<1?'ahora':min<60?'hace '+min+' min':'hace '+Math.round(min/60)+' h'); }

  const neg=D.total<0, cs=[...D.cuentas].sort((a,b)=>a.orden-b.orden), OFF=66;
  const pila=cs.map((c,i)=>tarjeta(c,i*OFF,i===cs.length-1,i+1)).join('');

   '<section class="panel"><div class="total'+(neg?' neg':'')+'"><div><div class="lbl">'+(neg?'Te faltan':'Si pago todo, me quedan')+'</div><div class="num">'+fmt(D.total)+'</div></div><span class="badge" style="background:'+(neg?'var(--redbg)':'var(--greenbg)')+';color:'+(neg?'var(--red)':'var(--green)')+'">'+sv(neg?'alerta':'check',20,2)+'</span></div><div class="sub">'+hace(D.ultimaRevision)+'</div></section>'+

}

function filaFijos(){
  const F=D.fijos; if(!F) return '';
  const nuevos=F.sugeridos.length;
  const sub=F.cuantos?fmt(F.totalMes)+' al mes · '+F.cuantosPagados+' de '+F.cuantos+' pagados'+(F.pendienteMes>0?' · faltan '+fmt(F.pendienteMes):''):(nuevos?'Encontré pagos que se repiten':'Agregá tus suscripciones y pagos del mes');
  return '<button class="fila-btn" onclick="verFijos()"><span class="ic" style="background:#E8E6FB;color:#4232B8">'+sv('calendario',18)+'</span><span class="t"><b>Pagos fijos</b><span>'+sub+'</span></span>'+(nuevos?'<span class="punto">'+nuevos+'</span>':'')+sv('chevron',18,2)+'</button>';
}
function verFijos(){vista='fijos';render();window.scrollTo(0,0);}
function estFijo(f){
  if(f.situacion==='pagado') return '<span class="est pagado">'+(f.como==='manual'?'Pagado ✓':'Pagado ✓')+'</span>';
  if(f.situacion==='atrasado') return '<span class="est atrasado">Atrasado</span>';
  return '<span class="est '+(f.diasVence<=3?'pronto':'pendiente')+'">'+(f.diasVence===0?'Hoy':'En '+diasTxt(f.diasVence))+'</span>';
}
function subFijo(f){
  const cu=f.cuentaId?cta(f.cuentaId).nombre:'';
  if(f.situacion==='pagado') return 'Pagado'+(f.pagadoEl?' el '+fcorta(f.pagadoEl):'')+(f.como==='manual'?' (a mano)':'')+(cu?' · '+cu:'');
  const cuando=f.frecuencia==='anual'?'cada año, '+fcorta(f.vence):'cada día '+f.dia;
  return (f.situacion==='atrasado'?'Tocaba el '+fcorta(f.vence):'Vence '+cuando)+(cu?' · '+cu:'');
}

}

function revisar(){
  const b=$('bRev'); if(b){b.disabled=true;b.classList.add('gira');}
  llamar('revisarAhora').then(d=>{D=d;render();toast('Correos revisados');}).catch(fallo);
}

/* ---------- Modal ---------- */
function abrir(html){$('hoja').innerHTML=html;$('velo').classList.add('on');document.body.style.overflow='hidden';}
function cerrar(){$('velo').classList.remove('on');document.body.style.overflow='';}
const cab=t=>'<div class="cab"><h2>'+t+'</h2><button class="x" aria-label="Cerrar" onclick="cerrar()">'+sv('x',18,2)+'</button></div>';
const opts=(arr,val)=>arr.map(c=>'<option value="'+c.id+'"'+(c.id===val?' selected':'')+'>'+esc(c.nombre)+'</option>').join('');

function abrirMov(id,pre){
  pre=pre||{}; confirmaBorrar=false;
  edit=id?D.movs.find(m=>m.id===id):null;
  let par=edit&&edit.parId?D.movs.find(m=>m.id===edit.parId):null;
  tipoMov=edit?(edit.parId?'PAGO':edit.tipo==='ENTRADA'?'INGRESO':'GASTO'):(pre.tipo||'GASTO');
  let origen=pre.cuentaId, destino=pre.destinoId;
  if(edit&&edit.parId){const sal=edit.tipo==='SALIDA'?edit:par, ent=edit.tipo==='ENTRADA'?edit:par; origen=sal?sal.cuentaId:''; destino=ent?ent.cuentaId:'';}
  else if(edit) origen=edit.cuentaId;
  const deb=D.cuentas.filter(c=>c.tipo==='debito'), cred=D.cuentas.filter(c=>c.tipo==='credito');
  if(!origen) origen=tipoMov==='PAGO'?(destino==='csm'?'bacd':'dav'):tipoMov==='INGRESO'?'dav':'bacc';
  if(!destino) destino='bacc';
  if(tipoMov==='PAGO'&&!edit&&destino){const c=cta(destino); pre.monto=pre.monto||(c.paraCero||'');}
  const bloqueado=!!(edit&&edit.parId);
  abrir(cab(edit?'Editar movimiento':'Nuevo movimiento')+
   '<div class="seg" role="group" aria-label="Tipo">'+[['GASTO','Gasto'],['INGRESO','Ingreso'],['PAGO','Pago tarjeta']].map(t=>'<button id="t_'+t[0]+'" class="'+(tipoMov===t[0]?'on':'')+'" '+(edit?'disabled':'')+' onclick="setTipo(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>'+
   '<label class="campo">Monto (USD)<input id="fMonto" class="montoIn" inputmode="decimal" placeholder="0.00" value="'+(edit?edit.monto.toFixed(2):(pre.monto?Number(pre.monto).toFixed(2):''))+'"></label>'+
   '<label class="campo"><span id="lCuenta">Cuenta</span><select id="fCuenta" '+(bloqueado?'disabled':'')+' data-todas=\''+JSON.stringify(D.cuentas.map(c=>({id:c.id,nombre:c.nombre,tipo:c.tipo})))+'\'></select></label>'+
   '<label class="campo" id="rDestino">Tarjeta a pagar<select id="fDestino" '+(bloqueado?'disabled':'')+'>'+opts(cred,destino)+'</select></label>'+
   '<label class="campo" id="rComercio">Descripción<input id="fComercio" placeholder="Ej. Super Selectos" value="'+esc(edit?edit.comercio:'')+'"></label>'+
   '<label class="campo" id="rCat">Categoría<select id="fCat" onchange="if(this.value===\'__n\'){volverAMov=true;abrirCat();}"><option value="">Automática</option>'+D.cats.filter(k=>k.nombre!=='Pagos').map(k=>'<option'+(edit&&edit.categoria===k.nombre?' selected':'')+'>'+esc(k.nombre)+'</option>').join('')+'<option value="__n">+ Nueva categoría…</option></select></label>'+
   (edit&&!bloqueado?'<label class="check" id="rRec"><input type="checkbox" id="fRec">Usar esta categoría siempre para este comercio</label>':'')+
   '<div class="dosc"><label class="campo">Fecha<input type="date" id="fFecha" value="'+ymd(edit?edit.fecha:new Date())+'"></label><label class="campo">Nota<input id="fNota" placeholder="Opcional" value="'+esc(edit?edit.nota:'')+'"></label></div>'+
   (bloqueado?'<div class="nota">Es un pago entre tus cuentas: al cambiar el monto o la fecha se corrigen los dos lados.</div>':'')+
   '<div class="botones">'+(edit?'<button class="btn peligro" id="bBorrar" onclick="borrar()">Borrar</button>':'')+'<button class="btn" id="bGuardar" onclick="guardar()">Guardar</button></div>');
  llenarCuentas(origen);
  setTipo(tipoMov,true);
}
function llenarCuentas(val){
  const s=$('fCuenta'), todas=JSON.parse(s.dataset.todas);
  const lista=tipoMov==='PAGO'?todas.filter(c=>c.tipo==='debito'):todas;
  if(!lista.some(c=>c.id===val)) val=lista[0].id;
  s.innerHTML=opts(lista,val);
}
function setTipo(t,inicial){
  tipoMov=t;
  ['GASTO','INGRESO','PAGO'].forEach(k=>{const b=$('t_'+k);if(b)b.classList.toggle('on',k===t);});
  const pago=t==='PAGO';
  $('rDestino').style.display=pago?'':'none';
  $('rComercio').style.display=pago?'none':'';
  $('rCat').style.display=pago?'none':'';
  $('lCuenta').textContent=pago?'Pagar desde':'Cuenta';
  if(!inicial){ llenarCuentas(t==='PAGO'?($('fDestino').value==='csm'?'bacd':'dav'):t==='INGRESO'?'dav':'bacc'); }
  $('fDestino').onchange=()=>{ if(!edit){ const c=cta($('fDestino').value); $('fMonto').value=c.paraCero?c.paraCero.toFixed(2):''; llenarCuentas(c.id==='csm'?'bacd':'dav'); } };
}
function guardar(){
  const monto=parseFloat(String($('fMonto').value).replace(/[$,\s]/g,''));
  if(!(monto>0)){toast('Escribí un monto');$('fMonto').focus();return;}
  const catv=$('fCat').value==='__n'?'':$('fCat').value;
  const o={id:edit?edit.id:null,tipo:tipoMov,cuentaId:$('fCuenta').value,destinoId:$('fDestino').value,monto:monto,
    comercio:$('fComercio').value.trim(),categoria:catv,fecha:$('fFecha').value,nota:$('fNota').value.trim(),recordar:!!($('fRec')&&$('fRec').checked)};
  $('bGuardar').disabled=true;
  llamar('guardarMovimiento',o).then(d=>{D=d;cerrar();render();toast('Guardado');}).catch(fallo);
}
function borrar(){
  const b=$('bBorrar');
  if(!confirmaBorrar){confirmaBorrar=true;b.textContent='¿Seguro? Tocá otra vez';return;}
  b.disabled=true;
  llamar('borrarMovimiento',edit.id).then(d=>{D=d;cerrar();render();toast('Borrado');}).catch(fallo);
}

/* ---------- Categoría nueva ---------- */
function abrirCat(){
  abrir(cab('Nueva categoría')+
   '<label class="campo">Nombre<input id="cNom" placeholder="Ej. Gym"></label>'+
   '<label class="campo">Comercios que entran aquí<input id="cPal" placeholder="Ej. SMART FIT, DECATHLON"></label>'+
   '<div class="nota">Separalos con comas. Cuando llegue un correo con ese comercio, se clasifica solo.</div>'+
   '<div class="campo">Ícono<div class="iconos">'+ICONOS_NUEVOS.map((k,i)=>'<label><input type="radio" name="cIc" value="'+k+'"'+(i===0?' checked':'')+' aria-label="'+k+'"><span>'+sv(k,20)+'</span></label>').join('')+'</div></div>'+
   '<div class="botones"><button class="btn claro" onclick="'+(volverAMov?'volverMov()':'cerrar()')+'">Cancelar</button><button class="btn" id="bCat" onclick="guardarCat()">Crear</button></div>');
}
let _movPendiente=null;
function volverMov(){volverAMov=false;abrirMov(edit?edit.id:null,{tipo:tipoMov});}
function guardarCat(){
  const n=$('cNom').value.trim(); if(!n){toast('Poné un nombre');return;}
  const ic=(document.querySelector('input[name=cIc]:checked')||{}).value||'etiqueta';
  $('bCat').disabled=true;
  llamar('crearCategoria',{nombre:n,palabras:$('cPal').value,icono:ic}).then(d=>{
    D=d; toast('Categoría creada');
    if(volverAMov){volverAMov=false;abrirMov(edit?edit.id:null,{tipo:tipoMov});$('fCat').value=n;} else cerrar();
  }).catch(fallo);
}

/* ---------- Ajustes de cuenta ---------- */
function abrirAjustes(){
  const c=cta(sel), cred=c.tipo==='credito'; quitarAj=false;
  abrir(cab(cred?'Ajustes · '+esc(c.nombre):'Ajustar saldo')+
   (cred?'<label class="campo">Pago del corte según el banco<input id="aCorteMonto" inputmode="decimal" placeholder="Ej. 74.45" value="'+(c.corteManual?c.saldoCorte.toFixed(2):'')+'"></label><div class="nota">Es lo que dice tu estado de cuenta del corte del '+fcorta(c.corteEstado)+' (el "pago de contado"), aunque ya lo hayás pagado. La app le resta los pagos que hagás.</div>'+
     '<label class="campo">Límite<input id="aLim" inputmode="decimal" value="'+c.limite+'"></label><div class="dosc"><label class="campo">Día de corte<input id="aCorte" inputmode="numeric" value="'+c.corteDia+'"></label><label class="campo">Día de pago<input id="aPago" inputmode="numeric" value="'+c.pagoDia+'"></label></div>':'')+
   (c.ajuste?'<div class="ajrow" id="aRow"><span>Incluye '+fmt(c.ajuste)+' '+esc(c.ajusteNota)+'</span><button class="btn claro" style="height:40px" onclick="quitarAj=true;this.parentNode.innerHTML=\'<span>Se quitará al guardar ✓</span>\'">Quitar</button></div>':'')+
   '<label class="campo">'+(cred?'Lo que debo según el banco':'Saldo real según el banco')+' (opcional)<input id="aReal" inputmode="decimal" placeholder="Dejalo vacío si está bien"></label>'+
   '<div class="nota">Si el número de la app no cuadra con el banco, escribí el real y se crea un ajuste por la diferencia.</div>'+
   '<div class="botones"><button class="btn" id="bAj" onclick="guardarAjustes()">Guardar</button></div>');
}
function guardarAjustes(){
  const c=cta(sel), cred=c.tipo==='credito';
  const o={id:c.id,quitarAjuste:quitarAj,saldoReal:$('aReal').value.replace(/[$,\s]/g,'')};
  if(cred){o.limite=$('aLim').value.replace(/[$,\s]/g,'');o.corteDia=$('aCorte').value;o.pagoDia=$('aPago').value;o.saldoCorte=$('aCorteMonto').value.replace(/[$,\s]/g,'');}
  $('bAj').disabled=true;
  llamar('actualizarCuenta',o).then(d=>{D=d;cerrar();render();toast('Listo');}).catch(fallo);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('velo').classList.contains('on'))cerrar();});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&CFG&&D&&!$('velo').classList.contains('on')) llamar('getDatos').then(d=>{D=d;render();}).catch(()=>{}); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
cargar();
setInterval(()=>{ if(CFG&&!$('velo').classList.contains('on')) llamar('getDatos').then(d=>{D=d;render();}).catch(()=>{}); },5*60*1000);
</script>
